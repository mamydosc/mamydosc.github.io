# Po każdej zmianie w gałęzi main strona buduje się i publikuje sama na GitHub Pages.
name: Publikacja strony
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"   # codziennie ok. 6:15 – odświeża liczniki i daty
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
